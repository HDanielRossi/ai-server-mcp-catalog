# Operator-applied fragment for coder-qwen only. It exposes only the fixed,
# serial canary validator and no lifecycle authority.
mcp_servers:
  implementation_validation_bridge:
    command: /usr/local/lib/implementation-validation-bridge-mcp/.venv/bin/python
    args:
      - /usr/local/lib/implementation-validation-bridge-mcp/server.py
      - --qwen-canary-only
    timeout: 370
    connect_timeout: 30
  qwen_canary_write_bridge:
    command: /usr/local/lib/implementation-validation-bridge-mcp/.venv/bin/python
    args:
      - /usr/local/lib/qwen-canary-write-bridge-mcp/server.py
    timeout: 120
    connect_timeout: 30
